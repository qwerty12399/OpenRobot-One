services:
  dev:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    image: openrobot-one:humble
    working_dir: /workspace
    volumes:
      - ..:/workspace
    environment:
      DISPLAY: ${DISPLAY:-host.docker.internal:0.0}
      QT_X11_NO_MITSHM: "1"
    stdin_open: true
    tty: true
